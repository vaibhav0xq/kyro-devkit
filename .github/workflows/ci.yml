```yaml
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sdk:
    name: SDK spec check, typecheck, tests, build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify

  examples:
    name: Shell and Python examples parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n examples/curl/kyro.sh
      - run: python3 -m py_compile examples/python/kyro_quickstart.py
```
